name: test

on:
  push:
    branches:
      - '**'
    tags:
      - '**'
    paths-ignore:
      - 'docs/**'
      - '*.md'
  pull_request:
    branches:
      - '**'
env:
  GOPROXY: https://proxy.golang.org
  CGO_ENABLED: 0

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.5'
          cache: true

      - name: Lint
        run: |
          make lint

      - name: Test
        run: |
          make test
